[project]
name = "unibase"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "markitdown[docx,pdf]>=0.1.8",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "polars[calamine,pyarrow]>=1.44.2",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.16.0",
    "rumdl>=0.2.43",
    "types-openpyxl>=3.1.5.20260827",
]
